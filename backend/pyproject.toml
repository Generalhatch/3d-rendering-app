[project]
name = "alignai-backend"
version = "0.1.0"
description = "AlignAI – LiDAR scan-to-plan alignment backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "open3d>=0.18.0",
    "ezdxf>=1.3.0",
    "laspy[laszip]>=2.5.0",
    "pye57>=0.4.8",
    "shapely>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "scikit-image>=0.22.0",
    "opencv-contrib-python-headless>=4.9.0",
    "alphashape>=1.3.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
